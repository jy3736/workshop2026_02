  - main [ref=e19]:
    - generic [ref=e206]:
      - 'heading "Windows 11: ChatGPT Work and Codex Setup Guide" [level=1] [ref=e207]'
      - paragraph [ref=e208]: This guide is for Windows 11 only. Install the ChatGPT desktop app first, then choose Chat, ChatGPT Work, or Codex for the task. Use the conservative Codex configuration only when you need to work in a course project. This edition adds a deep dive into Work's most common use cases and a walkthrough for building a web app project with Codex through vibe coding.
      - heading "What changed" [level=2] [ref=e209]
      - generic [ref=e210]:
        - strong [ref=e211]: "New update:"
        - text: "the former Codex app is integrated into the ChatGPT desktop app. Chat, ChatGPT Work, and Codex are separate work views in the same desktop app. Work is not a separately installed app. Labels and button locations can change, but choosing the right view, limiting scope, and reviewing work remain the same. Since July 2026, a local project can include multiple attached folders (a multi-folder project): ChatGPT can read and change files in every attached folder, and only the primary folder is used for Git operations and automatic AGENTS.md, skills, and config.toml discovery."
      - paragraph [ref=e212]: "Recent releases also bring the following changes, worth noting before class:"
      - list [ref=e213]:
        - listitem [ref=e214]:
          - strong [ref=e215]: "Desktop app update (July 30, 2026, v26.727):"
          - text: the built-in browser gained an address bar for revisiting history or searching Google, Chrome extension integration for mentioning open tabs and selected page text, multi-repo diff review across every repository in a multi-folder project, plus a new Activity view (which chats need your attention) and a larger image viewer.
        - listitem [ref=e216]:
          - strong [ref=e217]: "Voice input:"
          - text: the desktop app added ChatGPT Voice, so you can speak instructions or steer tasks in Chat, Work, and Codex. Check microphone permissions and room noise before demoing this in class.
        - listitem [ref=e218]:
          - strong [ref=e219]: "New \"Approve for me\" (auto-review) mode:"
          - text: Settings → General → Permissions can enable this mode. It keeps the same workspace boundary as Ask for approval, but sends boundary-crossing requests to automatic review instead of asking you. This guide still recommends keeping
          - strong [ref=e220]: Ask for approval
          - text: for course work rather than enabling auto-review for convenience — see "Configure Codex safely" below.
        - listitem [ref=e221]:
          - strong [ref=e222]: "Model change:"
          - text: starting August 31, 2026, Codex retires GPT-5.4 and GPT-5.4 mini for users signed in with a ChatGPT account. Replace gpt-5.4 with gpt-5.6-terra and gpt-5.4-mini with gpt-5.6-luna in any config or command that still names the old models.
        - listitem [ref=e223]:
          - strong [ref=e224]: "Codex Sites (preview):"
          - text: launched June 2026. Describe an internal tool (a dashboard, tracker, or knowledge base) with
          - code [ref=e225]: "@Sites"
          - text: ", and Codex builds, tests, and deploys it to an OpenAI-hosted URL shared inside your workspace, with no project folder needed. It is currently limited to ChatGPT Business (on by default) and Enterprise (admin-controlled); Free, Plus, Go, and Pro are not yet supported, and there is no public URL, custom domain, or code/data export — it is workspace-internal only. Most course accounts are Free or Plus, so check your plan first. For a web app project you want to fully own, inspect, and deploy anywhere, use the local Codex workflow in the deep dive below instead."
      - heading "Install on Windows 11" [level=2] [ref=e226]
      - list [ref=e227]:
        - listitem [ref=e228]:
          - text: Install or update the Windows ChatGPT desktop app from the
          - link "official ChatGPT download page" [ref=e229] [cursor=pointer]:
            - /url: https://chatgpt.com/download
          - text: .
        - listitem [ref=e230]: Open the app and sign in with your ChatGPT account. Available features can differ by plan, organization settings, and rollout.
        - listitem [ref=e231]:
          - text: For research, analysis, documents, decks, or other multi-step deliverables, select
          - strong [ref=e232]: ChatGPT
          - text: ", then switch the new chat to"
          - strong [ref=e233]: Work
          - text: .
        - listitem [ref=e234]:
          - text: For a project folder, code, commands, or diff review, select
          - strong [ref=e235]: Codex
          - text: from the ChatGPT dropdown.
