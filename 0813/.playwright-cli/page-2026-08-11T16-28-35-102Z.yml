      - heading "十四、資料安全、倫理與角色界線" [level=2] [ref=e778]
      - list [ref=e779]:
        - listitem [ref=e780]: 練習僅使用主辦單位提供、可公開使用或已去識別化的資料與專案。
        - listitem [ref=e781]: 不將學生個資、成績、未公開教材、未公開試題、帳密、內部文件或其他敏感資料輸入外部 AI 服務。
        - listitem [ref=e782]: Module 2 的考古題等有版權疑慮的內容，提醒教師在交付雙擊即用 HTML 前，確認自己有無合法散布這些內容的權利。
        - listitem [ref=e783]:
          - text: AI 的文字、程式與建議均為草稿或輔助結果；是否可用、結果是否正確，須由人員實際測試與確認；
          - strong [ref=e784]: 助教不代為判斷教材、題目、評量品質等專業內容
          - text: 。
        - listitem [ref=e785]: 涉及教學設計、學科內容、題目品質、正式評量、學生權益、行政判斷或資料處理的決策，不由本場助教／行政人員單獨作成。
        - listitem [ref=e786]: 如需延伸至 Office、網頁服務、郵件或行事曆工具，應先確認資料權限、單位規範與負責窗口，再安排後續支援。
      - heading "十五、課後銜接與預期價值" [level=2] [ref=e787]
      - paragraph [ref=e788]: 課後可保留本次的練習專案、問題紀錄格式與安裝指引，作為日後支援教師、實驗室或教學助理的起點。當教師提出需求時，受訓者不必承擔內容決策，而能協助確認設備與環境、定位檔案、啟動工具、完成基本測試，以及把尚未排除的問題整理成可交接的資訊。
      - paragraph [ref=e789]: 透過這項培訓，可為未來工作坊建立助教人才，也可讓參與教師工作坊的教師先替實驗室或教學助理完成前置技術訓練。目標是讓教師能專注於教學與專業工作，而由具備共同技術基礎的助教或行政人員協助處理環境、檔案、執行與初步測試問題。
      - paragraph [ref=e790]: 本場的預期價值，是建立一批具有共同技術語言與基本處置方法的支援人力，降低非工程背景教師使用 AI Agent 時的起步門檻，讓教師把更多時間放在教學與專業工作上。
