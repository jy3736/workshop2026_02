      - heading "九、Module 3 助教學習重點：從零打造測驗網頁" [level=2] [ref=e402]
      - figure "Module 3 測驗網站建立流程圖" [ref=e403]:
        - img "從題庫資料夾、設定與打包，到測驗網站的三步驟視覺流程。" [ref=e404]
        - generic:
          - heading "Module 3｜從題庫到測驗網站 做出來後，仍要實際測試" [level=3]:
            - text: Module 3｜從題庫到測驗網站
            - generic: 做出來後，仍要實際測試
          - generic:
            - generic:
              - text: ① 分析題庫
              - emphasis: 只讀取，先看規律
            - generic:
              - text: ② 設定與打包
              - emphasis: 來源與輸出分開
            - generic:
              - text: ③ 開啟與測試
              - emphasis: 驗收最終交付檔
        - generic [ref=e405]: 助教任務：把「不能用」說成能重現、能修正的問題。
      - paragraph [ref=e406]:
        - text: 教師版 Module 3 從「一個問題集資料夾」出發，用 7 個步驟跟 Codex 討論、逐步設計出一套測驗網頁產生工具。這是整個教師工作坊
        - strong [ref=e407]: 最吃 prompt 表達能力
        - text: 的一段，也是助教最需要協助教師「把話講清楚」的地方；它同時也是助教工作坊的核心示範：整套訓練希望助教學到的，正是這種「從零跟 AI Agent 討論、設計、做出來」的方法，而不是操作某個已經包好的現成工具。
