      - heading "八、Module 2 助教學習重點：從零打造考古題下載／切題／清理流程" [level=2] [ref=e318]
      - figure "Module 2 題庫處理流程圖" [ref=e319]:
        - img "從取得 PDF、建立題庫到清理與驗收的三步驟視覺流程。" [ref=e320]
        - generic:
          - heading "Module 2｜從 PDF 到題庫 每一階段都要先驗收，再往下走" [level=3]:
            - text: Module 2｜從 PDF 到題庫
            - generic: 每一階段都要先驗收，再往下走
          - generic:
            - generic:
              - text: ① 下載
              - emphasis: 試題＋標準答案
            - generic:
              - text: ② 切題
              - emphasis: 一題一圖＋答案鍵
            - generic:
              - text: ③ 清理與驗收
              - emphasis: 先乾跑，再正式處理
        - generic [ref=e321]: 助教任務：確認輸入、輸出、張數與規則相符。
      - paragraph [ref=e322]:
        - text: 教師版 Module 2 的目標，是把一份 PDF 考古題轉成「一題一張乾淨圖片 ＋ 標準答案 JSON」的問題集資料夾，整個流程分成下載、切題、清理三個階段，前一階段的輸出就是下一階段的輸入。助教訓練的重點
        - strong [ref=e323]: 不是背下某個現成工具怎麼呼叫
        - text: ，而是理解這三個階段各自在做什麼、為什麼需要驗收，並具備跟 Codex 討論、從零設計出等效處理流程的能力——這樣不管教師手上換成哪一份考卷、遇到原本沒處理過的版面，助教都能協助把問題從頭想清楚，而不是卡在「這個做法不支援」就沒辦法往下走。
      - table [ref=e325]:
        - rowgroup [ref=e326]:
          - row [ref=e327]:
            - columnheader "階段" [ref=e328]
            - columnheader "在做什麼" [ref=e329]
            - columnheader "輸入" [ref=e330]
            - columnheader "輸出" [ref=e331]
        - rowgroup [ref=e332]:
          - row [ref=e333]:
            - cell "① 下載" [ref=e334]
            - cell "抓試題＋標準答案 PDF" [ref=e335]
            - cell "學年度、群類" [ref=e336]
            - cell [ref=e337]:
              - code [ref=e338]: raw/<year>/*.pdf
          - row [ref=e339]:
            - cell "② 切題" [ref=e340]
            - cell "把 PDF 切成一題一張圖，配對答案" [ref=e341]
            - cell "①的 PDF" [ref=e342]
            - cell [ref=e343]:
              - code [ref=e344]: repo/<name>/*.png
              - text: ＋
              - code [ref=e345]: keys.json
          - row [ref=e346]:
            - cell "③ 清理" [ref=e347]
            - cell "裁掉多餘空白、塗掉題號" [ref=e348]
            - cell "②的 png" [ref=e349]
            - cell "原地覆寫、變乾淨的 png" [ref=e350]
      - heading "教師在這裡最容易卡住的地方" [level=3] [ref=e351]
      - list [ref=e352]:
        - listitem [ref=e353]: Prompt 只講「幫我把這份 PDF 處理成一題一張圖」，沒有講清楚輸出檔名規則、資料夾位置與答案 JSON 的格式，Codex 產出的結構跟教師預期對不起來。
        - listitem [ref=e354]: 下載試題頁面時抓錯群類或科目，卻沒有先肉眼核對就往下一步做。
        - listitem [ref=e355]: 切題時遇到共同科目（數學／國文／英文）這類版面跟原本設計不同的考卷，原本針對某一類考卷調校的處理邏輯（檔名規則、題數假設）套用失敗，教師不知道該怎麼調整。
        - listitem [ref=e356]:
          - text: 清理階段沒有先「乾跑」確認每張圖只抓到 1 個題號區塊，就直接批次塗白存檔——清理是
          - strong [ref=e357]: 原地覆寫
          - text: ，沒有自動備份，一旦判斷錯誤就很難救回來。
        - listitem [ref=e358]: 題數、檔名規則這類假設容易被寫死在流程裡，換一份考卷格式不同就整組跑不動，教師不知道要跟 Codex 明確講清楚新的規則。
      - heading "助教應具備的先備知識與技術能力" [level=3] [ref=e359]
      - list [ref=e360]:
        - listitem [ref=e361]: 理解三個階段各自的輸入輸出慣例（見上方流程總覽表），能一眼看出教師目前卡在哪個階段。
        - listitem [ref=e362]: 知道怎麼跟 Codex 討論，把「下載試題與答案 PDF」這件事拆成明確的目標、情境、限制、完成標準，而不是一句話丟過去就期待它自己想清楚每個細節（例如：要保留原始檔名、要能肉眼核對群類科目是否正確）。
        - listitem [ref=e363]: 理解切題階段的核心限制在哪裡（例如：固定的頁面版面假設、題號如何被辨識、答案怎麼跟題目配對），能協助教師判斷「原本的做法為什麼在這份新考卷上失敗」，並提出具體、可驗證的修正需求，而不是整段重做。
        - listitem [ref=e364]: 知道清理階段一定要先「乾跑」（先印出偵測結果、不動任何像素），確認每張圖都剛好抓到預期數量的區塊後才正式執行；也知道清理是原地覆寫、沒有備份，唯一救援方式是回頭重新切那一題的圖，而不是在清理階段硬套規則修。
        - listitem [ref=e365]:
          - text: 會用檔案總管或終端機比對圖片張數與
          - code [ref=e366]: keys.json
          - text: 筆數是否一致，這是每個階段都適用的驗收方法。
      - heading "常見狀況快速對照表" [level=3] [ref=e367]
      - table [ref=e369]:
        - rowgroup [ref=e370]:
          - row [ref=e371]:
            - columnheader "狀況" [ref=e372]
            - columnheader "代表什麼" [ref=e373]
