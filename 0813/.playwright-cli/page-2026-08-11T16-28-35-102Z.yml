      - heading "一、工作坊定位" [level=2] [ref=e89]
      - paragraph [ref=e90]: 本工作坊是一場半日、初階、以個人電腦實作為主的培訓，目的是培養可在第一線協助教師與行政同仁使用 AI Agent 的助教與行政人員。對象以教師或各單位推薦的助教為優先；如有名額，也歡迎具備基本電腦與 AI 使用經驗的行政／辦事同仁及其他有興趣者參與。預計約 30 人，參與者以自己的筆記型電腦獨立操作。
      - paragraph [ref=e91]:
        - text: 課程以 ChatGPT Codex 為示範工具，但重點不在學習單一平台，而是建立可轉用到其他 AI Agent 的工作方法：
        - strong [ref=e92]: 說清楚目標、情境、限制與完成標準；讓 AI 協助產生工具；自行找到並執行產出；測試與判讀結果；再逐步修正。
      - paragraph [ref=e93]:
        - text: 本場
        - strong [ref=e94]: 不是
        - text: 教材設計、命題或評量設計課程，也
        - strong [ref=e95]: 不是
        - text: 程式設計師養成、學科內容審查或行政決策課程。它的核心任務是培養能支援教師使用 AI Agent 與簡易 vibe coding 工具的第一線人員，降低非工程背景教師在本機安裝、檔案管理、執行、測試與基本問題排除上的負擔。助教與行政人員的任務是提供技術協助，協助處理環境安裝、專案資料夾、檔案位置、工具啟動、基本測試與問題資訊整理；教材內容、題目品質、學科正確性與行政決定，仍由教師、相關單位或具專業者判斷。
      - heading "二、培訓目標" [level=2] [ref=e96]
      - paragraph [ref=e97]: 完成本場後，參與者應能在他人需要協助時，先釐清問題位置、蒐集必要資訊，再協助完成下列基本工作：
      - list [ref=e98]:
        - listitem [ref=e99]: 說明 Chatbot 與 AI Agent 的差異，知道哪些工作可請 AI 協助、哪些結果仍需人員確認。
        - listitem [ref=e100]: 安裝、開啟與初步驗證 VS Code、Python、Node.js 等本機工具，辨識常見的登入、權限、網路與版本問題。
        - listitem [ref=e101]: 建立清楚的專案資料夾，分辨來源資料、程式檔、產出檔與執行位置，並能以完整路徑說明問題所在。
        - listitem [ref=e102]: 使用自然語言進行小範圍 vibe coding，產生一個可在本機開啟的靜態 HTML 小工具。
        - listitem [ref=e103]: 以使用者情境測試工具，記錄「預期結果、實際結果、操作步驟、錯誤訊息或畫面」，向 AI Agent 提出可驗證的修正需求。
        - listitem [ref=e104]: 在角色界線與資料安全原則下，協助教師或同仁跨過技術門檻，讓其能專注於教學與專業工作。
      - heading "三、對象、規模與執行條件" [level=2] [ref=e105]
      - table [ref=e107]:
        - rowgroup [ref=e108]:
          - row [ref=e109]:
            - columnheader "項目" [ref=e110]
            - columnheader "執行內容" [ref=e111]
        - rowgroup [ref=e112]:
          - row [ref=e113]:
            - cell "優先對象" [ref=e114]
            - cell "由教師或各單位推薦的助教；如有名額，亦歡迎具基本電腦與 AI 使用經驗的行政／辦事同仁及其他有興趣者。" [ref=e115]
          - row [ref=e116]:
            - cell "建議規模" [ref=e117]
            - cell "約 30 人。每位參與者使用自己的帳號、筆記型電腦與本機資料夾獨立操作，不安排分組共同產出。" [ref=e118]
          - row [ref=e119]:
            - cell "上課時段" [ref=e120]
            - cell "12:30 報到；13:00-17:30 上課；14:50-15:10 茶敘休息。" [ref=e121]
          - row [ref=e122]:
            - cell "參與者設備" [ref=e123]
            - cell "筆記型電腦、電源供應器與可連線網路；電腦需具軟體安裝或更新權限。建議攜帶日後實際支援工作會使用的設備。" [ref=e124]
          - row [ref=e125]:
            - cell "主辦單位準備" [ref=e126]
            - cell "提供可公開使用的練習專案、練習資料、安裝連結與基本操作指引；現場準備網路、投影與至少一個可協助安裝／登入問題的支援窗口。" [ref=e127]
      - heading "四、下午流程與操作檢核" [level=2] [ref=e128]
      - table [ref=e130]:
        - rowgroup [ref=e131]:
          - row [ref=e132]:
            - columnheader "時間" [ref=e133]
            - columnheader "單元與帶領重點" [ref=e134]
            - columnheader "參與者操作" [ref=e135]
            - columnheader "單元檢核點" [ref=e136]
        - rowgroup [ref=e137]:
          - row [ref=e138]:
            - cell "12:30-13:00" [ref=e139]
            - cell "報到、設備與帳號確認：確認網路、帳號登入、軟體安裝權限與電源。" [ref=e140]
            - cell "開啟電腦、連線網路、登入必要服務；將問題先依帳號、網路、權限或設備分類。" [ref=e141]
            - cell "每人知道自己使用的帳號與本機資料夾位置；未完成者列入休息時間協助清單。" [ref=e142]
          - row [ref=e143]:
            - cell "13:00-13:25" [ref=e144]
            - cell "認識 AI Agent 與助教支援角色：說明 Chatbot／AI Agent、可做與不可直接交給 AI 的工作，以及技術支援的角色界線。" [ref=e145]
            - cell "以一個日常支援情境，練習把模糊需求補成「目標、情境、限制、完成標準」。" [ref=e146]
            - cell "能說出至少一項可協助的技術工作與一項須由教師或專業人員確認的工作。" [ref=e147]
          - row [ref=e148]:
            - cell "13:25-14:20" [ref=e149]
            - cell "建置本機工具與專案資料夾：介紹 VS Code、Python、Node.js、終端機與資料夾的用途，依指引安裝或驗證。" [ref=e150]
            - cell "建立本次專案資料夾；開啟 VS Code；在終端機執行提供的版本或啟動檢查指令。" [ref=e151]
            - cell "能在自己的電腦開啟專案資料夾，並截取或記下可供判讀的檢查結果。" [ref=e152]
          - row [ref=e153]:
            - cell "14:20-14:50" [ref=e154]
            - cell "開啟練習專案並確認執行流程：以主辦單位練習專案示範從檔案到結果的完整路徑。" [ref=e155]
            - cell "找到來源檔、輸出檔與啟動位置；依步驟開啟網頁或程式，比對畫面是否與預期一致。" [ref=e156]
            - cell "能指出專案根目錄、主要檔案與執行後結果，且能描述下一步該在哪裡操作。" [ref=e157]
          - row [ref=e158]:
            - cell "14:50-15:10" [ref=e159]
            - cell "茶敘休息／未完成環境設定協助。" [ref=e160]
            - cell "休息；尚未完成環境建置者依問題清單接受協助。" [ref=e161]
            - cell "支援人員優先處理會阻斷下午實作的登入、安裝、權限與網路問題。" [ref=e162]
          - row [ref=e163]:
            - cell "15:10-16:10" [ref=e164]
            - cell "vibe coding 實作：建立簡易網頁小工具，示範如何提出小而可驗證的需求。" [ref=e165]
            - cell "以主辦單位題目或自己的非敏感情境，建立單一靜態 HTML 小工具。" [ref=e166]
            - cell "產出至少一個可開啟的 HTML 頁面；能找到其檔案位置並說明工具的用途與限制。" [ref=e167]
          - row [ref=e168]:
            - cell "16:10-17:00" [ref=e169]
            - cell "測試工具、描述問題與請 AI 修正：示範將「不能用」轉成可重現、可修正的問題描述。" [ref=e170]
            - cell "測試按鈕、輸入、文字與結果；記錄操作步驟、預期／實際結果與錯誤訊息；請 AI Agent 協助修正後重新測試。" [ref=e171]
            - cell "完成至少一輪「測試 → 回報 → 修正 → 再測試」，並保留修正前後的差異或紀錄。" [ref=e172]
          - row [ref=e173]:
            - cell "17:00-17:20" [ref=e174]
            - cell "常見支援情境與問題處置：回顧未來常見的協助請求與升級處理原則。" [ref=e175]
            - cell "依情境判斷自己可先協助的事項、須交給教師／資訊單位／專業人員的事項，以及需保留的問題資訊。" [ref=e176]
            - cell "能依「定位、蒐集、分類、最小修正、重新驗證、適當升級」順序處理問題。" [ref=e177]
          - row [ref=e178]:
            - cell "17:20-17:30" [ref=e179]
            - cell "回顧、提問與課程收束。" [ref=e180]
            - cell "回顧個人的完成項目與仍需協助的問題；提出最後提問。" [ref=e181]
            - cell "每人帶走可供日後支援使用的練習專案、問題紀錄方式與下一步。" [ref=e182]
      - heading "五、實作範圍與操作原則" [level=2] [ref=e183]
      - heading "小工具的最小範圍" [level=3] [ref=e184]
      - list [ref=e185]:
        - listitem [ref=e186]: 僅使用 HTML、CSS 與必要的 JavaScript，建立單一、可檢查的簡易網頁工具。
        - listitem [ref=e187]: 工具在本機資料夾開啟與測試；不處理帳號系統、資料庫、即時同步、正式部署或正式評量系統。
        - listitem [ref=e188]: 評量重點是參與者能否找到、執行、測試與修正工具，而非工具主題、介面美觀、教材品質或程式複雜度。
      - heading "建議操作順序" [level=3] [ref=e189]
      - list [ref=e190]:
        - listitem [ref=e191]: 建立專案資料夾，清楚命名並區分來源資料、程式檔與輸出成果。
        - listitem [ref=e192]: 向 AI Agent 說明工具的使用者、目的、功能範圍、限制與完成標準。
        - listitem [ref=e193]: 確認 AI Agent 實際建立或修改的檔案，避免只停留在對話視窗中。
        - listitem [ref=e194]: 依需要在本機開啟檔案或啟動服務，以明確情境測試功能。
        - listitem [ref=e195]: 記錄預期結果、實際結果、重現步驟、相關檔案路徑與錯誤訊息；一次提出一項可驗證的修正需求。
        - listitem [ref=e196]: 修正後重新執行同一情境，確認問題是否已解決；若仍未解決，再補足資訊或交由合適人員處理。
      - heading "六、與教材原始設計對象的差異" [level=2] [ref=e197]
      - paragraph [ref=e198]: 本工作坊「vibe coding 實作」單元使用的 Module 1～3，原本是為非工程背景的大學教師設計的實作教材（把教材轉成練習工具）。助教接觸的是同一套教材，但學習焦點不同——下表整理兩種使用情境的差異：
      - table [ref=e200]:
        - rowgroup [ref=e201]:
          - row [ref=e202]:
            - columnheader "面向" [ref=e203]
            - columnheader "Module 1～3 原始設計情境（教師）" [ref=e204]
            - columnheader "本次助教訓練" [ref=e205]
        - rowgroup [ref=e206]:
          - row [ref=e207]:
            - cell "對象" [ref=e208]
            - cell "非工程背景大學教師，想把教材做成練習工具" [ref=e209]
            - cell "由教師或單位推薦的助教，具基本電腦與 AI 使用經驗" [ref=e210]
          - row [ref=e211]:
            - cell "目標" [ref=e212]
            - cell "產出一份可用的題組與自主練習小工具" [ref=e213]
            - cell "具備排除環境、操作與常見錯誤的支援能力，不以產出教材為目標" [ref=e214]
          - row [ref=e215]:
            - cell "涵蓋範圍" [ref=e216]
            - cell "完整跑過從安裝到成品的所有階段" [ref=e217]
            - cell "聚焦 Module 1～3，且每個模組都以「理解原理、能協助從零重建」為訓練重點" [ref=e218]
          - row [ref=e219]:
            - cell "深度" [ref=e220]
