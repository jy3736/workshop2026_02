      - heading "十二、現場支援與問題處置流程" [level=2] [ref=e658]
      - paragraph [ref=e659]: 遇到問題時，助教或行政人員可依下列順序處理，避免在未釐清問題前反覆嘗試：
      - list [ref=e660]:
        - listitem [ref=e661]:
          - strong [ref=e662]: 定位：
          - text: 確認使用者、電腦、帳號、專案資料夾，以及目前操作到哪個模組、哪一步。
        - listitem [ref=e663]:
          - strong [ref=e664]: 蒐集：
          - text: 記下完整或相對檔案路徑、使用的指令或 prompt、螢幕畫面、錯誤訊息與已嘗試的處理方式。
        - listitem [ref=e665]:
          - strong [ref=e666]: 分類：
          - text: 判斷問題較可能屬於登入／網路、安裝／權限、檔案路徑、prompt 表達不清，或工具功能與結果。
        - listitem [ref=e667]:
          - strong [ref=e668]: 最小修正：
          - text: 只改變一個可回復的項目，例如重新開啟正確資料夾、修正一個檔名或路徑、依指引重新執行一項指令，之後立即測試。
        - listitem [ref=e669]:
          - strong [ref=e670]: 重新驗證：
          - text: 使用原本會失敗的操作重做一次，確認問題是否真的排除，而非僅看見畫面暫時改變。
        - listitem [ref=e671]:
          - strong [ref=e672]: 適當升級：
          - text: 權限、校園網路、帳號、資安、系統設定或專業內容問題，保留紀錄後交由資訊單位、教師、行政主管或具專業者處理；學科內容、題目品質等專業判斷一律交回教師。
      - heading "協助教師改善模糊 prompt：四要素檢查法" [level=3] [ref=e673]
      - paragraph [ref=e674]: 教師常見的模糊 prompt 像是「幫我做一個測驗網頁」。助教可以用「目標、情境、限制、完成標準」四個要素引導教師補完：
      - table [ref=e676]:
        - rowgroup [ref=e677]:
          - row [ref=e678]:
            - columnheader "要素" [ref=e679]
            - columnheader "檢查問題" [ref=e680]
            - columnheader "示範補完" [ref=e681]
