  - generic [ref=e21]:
    - generic [ref=e22]:
      - heading "Windows 11 Vibe Coding 與 AI Agent 環境建置" [level=1] [ref=e23]
      - paragraph [ref=e24]: 本模組聚焦在 Windows 11 筆電上的 Vibe Coding 與 AI Agent 工作環境建置。先安裝 ChatGPT 桌面 app，再用一鍵安裝腳本準備開發工具；最後以 Chat、ChatGPT Work 與 Codex 的正確工作介面完成幾個小型驗證任務。
      - heading "學習目標 (Learning Objectives)" [level=2] [ref=e25]
      - paragraph [ref=e26]: 完成本模組後，教師應能：
      - list [ref=e27]:
        - listitem [ref=e28]: 在自己的 Windows 11 筆電上獨立啟動可運作的 Vibe Coding 與 AI Agent 工作環境。
        - listitem [ref=e29]: 使用 ChatGPT 桌面 app 的 Chat、ChatGPT Work 與 Codex 工作介面，依任務選擇適合的入口。
        - listitem [ref=e30]: 使用 VS Code 作為主要開發介面，搭配 Codex CLI 與 Codex 擴充套件進行程式生成、修改與檢查。
        - listitem [ref=e31]: 使用 uv 與 npm 管理 Python 與 Node.js 的套件及專案環境。
        - listitem [ref=e32]:
          - text: 透過 GitHub CLI (
          - code [ref=e33]: gh
          - text: ) 以瀏覽器登入 GitHub，完成專案 clone、推送與 GitHub Pages 部署。
        - listitem [ref=e34]: 依據 checklist 自行驗證環境，並排除常見安裝問題。
      - heading "先備條件 (Prerequisites)" [level=2] [ref=e35]
      - table [ref=e37]:
        - rowgroup [ref=e38]:
          - row [ref=e39]:
            - columnheader "項目" [ref=e40]
            - columnheader "說明" [ref=e41]
        - rowgroup [ref=e42]:
          - row [ref=e43]:
            - cell "個人筆電" [ref=e44]
