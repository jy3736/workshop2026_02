            - cell "套件與檔案處理可運作" [ref=e342]
          - row [ref=e343]:
            - cell "Word 驗證" [ref=e344]
            - cell "讀取 Word 文件內容，並產生一份修改後的 Word 檔案" [ref=e345]
            - cell "Office 文件處理可運作" [ref=e346]
          - row [ref=e347]:
            - cell "JavaScript 驗證" [ref=e348]
            - cell [ref=e349]:
              - text: 以
              - code [ref=e350]: npx http-server
              - text: 啟動簡單的 local web server，確認 client-side 與 server-side 程式正常執行
