            - cell "能開啟終端機 (terminal) 並輸入指令" [ref=e57]
      - heading "最低電腦需求 (Minimum Computer Requirements)" [level=2] [ref=e58]
      - paragraph [ref=e59]: 本工作坊會同時開啟 VS Code、Node.js、Python、終端機與瀏覽器登入頁面，建議筆電至少符合下列規格。標示「建議」者為較順暢的體驗門檻。
