          - row [ref=e46]:
            - cell "網路" [ref=e47]
            - cell "可連線下載安裝套件與存取 AI 服務" [ref=e48]
          - row [ref=e49]:
            - cell "ChatGPT 帳號" [ref=e50]
            - cell "可使用 Codex 的 ChatGPT 帳號；先登入 ChatGPT 桌面 app。實際可用功能依方案、工作區與推出狀況而異，CLI 與 VS Code 擴充套件可使用同一登入帳號。" [ref=e51]
          - row [ref=e52]:
            - cell "GitHub 帳號" [ref=e53]
