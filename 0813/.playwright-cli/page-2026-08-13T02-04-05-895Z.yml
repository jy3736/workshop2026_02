      - heading "Apply for a GitHub Account and Join GitHub Education (Free GitHub Copilot)" [level=2] [ref=e590]
      - paragraph [ref=e591]: Both students and college faculty can apply for a free GitHub account, then verify their academic status through GitHub Education (GitHub Global Campus) to unlock the education tier of GitHub Copilot Pro and other normally paid tools at no cost. Complete the three steps below before class starts.
      - heading "1. Create a GitHub Account" [level=3] [ref=e592]
      - list [ref=e593]:
        - listitem [ref=e594]:
          - text: Open a browser and go to
          - link "https://github.com/join" [ref=e595] [cursor=pointer]:
            - /url: https://github.com/join
          - text: .
        - listitem [ref=e596]: Enter an email address. Using your school-issued edu email (e.g., xxx@your-school.edu.tw) makes the later GitHub Education verification more likely to auto-approve. If you don't have one yet, sign up with a personal email and verify later during the GitHub Education application.
        - listitem [ref=e597]: Set a password, choose a username, complete the human-verification puzzle, then check your inbox and confirm the verification email.
        - listitem [ref=e598]:
          - text: After signing in, turn on two-factor authentication (2FA), and add your school email under
          - strong [ref=e599]: Settings → Emails
          - text: (Add email address) so it's ready for verification.
      - heading "2. Join GitHub Education (GitHub Global Campus)" [level=3] [ref=e600]
      - paragraph [ref=e601]: "GitHub Education has two application paths: the Student Developer Pack for students, and Teacher/Educator Benefits for faculty. Once verified, the account shows a confirmed academic status and unlocks GitHub Copilot Pro and other paid features for free."
      - table [ref=e603]:
        - rowgroup [ref=e604]:
          - row [ref=e605]:
            - columnheader "Role" [ref=e606]
            - columnheader "Application Page" [ref=e607]
            - columnheader "Main Benefits" [ref=e608]
        - rowgroup [ref=e609]:
          - row [ref=e610]:
            - cell "Student" [ref=e611]
            - cell [ref=e612]:
              - link "education.github.com/pack" [ref=e613] [cursor=pointer]:
                - /url: https://education.github.com/pack
            - cell "Free GitHub Copilot Pro, GitHub Pro account features, and discounts on many developer tools" [ref=e614]
          - row [ref=e615]:
            - cell "College faculty" [ref=e616]
            - cell [ref=e617]:
              - link "education.github.com/teachers" [ref=e618] [cursor=pointer]:
                - /url: https://education.github.com/teachers
            - cell "Free GitHub Copilot Pro and GitHub Classroom, for setting up course and assignment repositories" [ref=e619]
      - paragraph [ref=e620]: "Application steps:"
      - list [ref=e621]:
        - listitem [ref=e622]: Sign in with the GitHub account created above (or an existing one).
        - listitem [ref=e623]:
          - text: Go to
          - link "education.github.com" [ref=e624] [cursor=pointer]:
            - /url: https://education.github.com/
          - text: and click "Get student benefits" or "Get teacher benefits" depending on your role.
        - listitem [ref=e625]: Select your school; if it isn't listed, type the school name manually.
        - listitem [ref=e626]: "Choose a verification method: a school edu email is usually verified automatically within minutes; without one, upload document verification instead — a clear photo or scan of a student ID, enrollment certificate, faculty ID, or employment letter showing your name, school, and date."
        - listitem [ref=e627]: After submitting, watch the inbox tied to your GitHub account for a status update; review time ranges from a few minutes to several business days depending on the verification method.
        - listitem [ref=e628]: Once approved, return to education.github.com and confirm the status shows "Verified."
      - blockquote [ref=e629]:
        - paragraph [ref=e630]: Faculty verification sometimes needs manual review and can take longer than student verification. If there's no response after a week, check progress through the GitHub Education support form. Benefits expire when a student graduates or a faculty member's employment changes, and re-verification is required to continue.
      - heading "3. Activate and Confirm Free Copilot Access" [level=3] [ref=e631]
      - list [ref=e632]:
        - listitem [ref=e633]:
          - text: Go to
          - link "github.com/settings/copilot" [ref=e634] [cursor=pointer]:
            - /url: https://github.com/settings/copilot
          - text: and confirm the plan shows the education-tier free license (Copilot Pro via GitHub Education).
        - listitem [ref=e635]: "Install the GitHub Copilot and GitHub Copilot Chat extensions in VS Code, and sign in with the same verified GitHub account:"
      - code [ref=e637]: code --install-extension GitHub.copilot code --install-extension GitHub.copilot-chat
      - list [ref=e638]:
        - listitem [ref=e639]: Open any code file to confirm Copilot offers suggestions, or ask a question in the Copilot Chat panel to confirm it responds.
      - heading "4. Common Issues" [level=3] [ref=e640]
      - list [ref=e641]:
        - listitem [ref=e642]:
          - strong [ref=e643]: "School email doesn't end in .edu:"
          - text: Still fine — use document verification instead. GitHub Education doesn't require a specific email domain.
        - listitem [ref=e644]:
          - strong [ref=e645]: "Verification rejected or stuck:"
          - text: Make sure the uploaded document clearly shows your name, school, and date; try a different proof of enrollment/employment if needed.
        - listitem [ref=e646]:
          - strong [ref=e647]: "Already paying for Copilot:"
          - text: Approval usually credits or replaces the paid subscription; check the GitHub billing page if anything looks off.
        - listitem [ref=e648]:
          - strong [ref=e649]: "After graduating or leaving the school:"
          - text: GitHub Education benefits stop once academic status expires; keep your enrollment/employment current and re-verify as GitHub prompts.
      - figure [ref=e650]:
        - img "實作流程：設定 ChatGPT、Work 與 Codex，連結 GitHub 並部署網站，最後完成四項驗證任務。" [ref=e651]
      - heading "Hands-on Activities" [level=2] [ref=e652]
      - heading "1. Set up ChatGPT Work and Codex" [level=3] [ref=e653]
      - list [ref=e654]:
        - listitem [ref=e655]: Open the ChatGPT desktop app and sign in. Use Chat for quick questions; select ChatGPT, then Work for a multi-step, reviewable outcome; select Codex for a course project, code, commands, and diffs.
        - listitem [ref=e656]:
          - text: In Codex, open only the intended course project folder. Before the first task, choose
          - strong [ref=e657]: Ask for approval
          - text: ; do not enable
          - strong [ref=e658]: Full access
          - text: by default. Review approval requests, diffs, and output files.
        - listitem [ref=e659]:
          - text: For a terminal workflow, run
          - code [ref=e660]: codex
          - text: and sign in through the browser with the same ChatGPT account. The VS Code Codex extension can use that account too.
        - listitem [ref=e661]: If a later task needs browser automation, let the AI agent install and configure whatever tools it needs on its own; this module doesn't pre-install any browser automation add-ons.
        - listitem [ref=e662]:
          - text: Run the guided "Hello, AI Agent" task (ask the agent to create a
          - code [ref=e663]: hello.txt
          - text: file) to confirm the AI agent can receive instructions, produce a file, and report back.
      - heading "2. Connect GitHub and Deploy GitHub Pages" [level=3] [ref=e664]
      - list [ref=e665]:
        - listitem [ref=e666]:
          - text: Run
          - code [ref=e667]: gh auth login
          - text: and sign in entirely through the browser with a one-time code — no SSH keys or passwords typed into the terminal — which also sets up git credentials and your commit identity (user.name / user.email) in one step.
        - listitem [ref=e668]:
          - text: Practice cloning a project with
          - code [ref=e669]: gh repo clone
          - text: ", and use"
          - code [ref=e670]: gh repo create … --push
          - text: together with GitHub Pages to publish a static site to a public URL.
      - heading "3. Four Verification Tasks" [level=3] [ref=e671]
      - table [ref=e673]:
