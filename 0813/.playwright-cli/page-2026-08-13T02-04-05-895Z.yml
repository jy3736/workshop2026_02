      - paragraph [ref=e368]: This module prepares a Vibe Coding and AI Agent environment on a Windows 11 laptop. Install the ChatGPT desktop app first, then use the setup script for the developer tools. Finally, choose Chat, ChatGPT Work, or Codex for the appropriate verification task.
